name: DuMux CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to checkout for the benchmark run
        required: false
        type: string
      benchmark_file:
        description: Path to the semantic benchmark JSON-LD file
        required: false
        type: string
        default: benchmark/1.0.0/minimal-configurations.json
      benchmark_artifact_name:
        description: Optional artifact with the benchmark resources (downloaded from RoHub)
        required: false
        type: string
        default: ''

env:
  ROCRATE_AGENT_NAME: Sarbani Roy
  ROCRATE_AGENT_ORCID: https://orcid.org/0000-0002-5990-0076
  BENCHMARK_NAME: taylor-couette-flow
  BENCHMARK_VERSION: 1.0.0
  EXAMPLE_BENCHMARK_FILE: ${{ inputs.benchmark_file || 'benchmark/1.0.0/minimal-configurations.json' }}
  BRANCH_NAME: ${{ inputs.checkout_ref || github.head_ref || github.ref_name }}
  SOFTWARE_NAME: dumux
  ROCRATE_LICENSE: https://opensource.org/licenses/MIT
  ROCRATE_NAME: taylor-couette-flow provenance (DuMux)
  ROCRATE_DESCRIPTION_BASE: Provenance run of the taylor-couette-flow benchmark using DuMux

jobs:
  run-examples:
    name: DuMux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: taylor-couette-flow-model-validation
          use-mamba: true
          conda-remove-defaults: "true"

      - name: Set strict channel priority
        shell: bash -l {0}
        run: conda config --set channel_priority strict

      - name: Update benchmark environment
        shell: bash -l {0}
        run: mamba env update -n taylor-couette-flow-model-validation -f environment_benchmarks.yml

      - name: Install provenance Python packages
        shell: bash -l {0}
        run: |
          python -m pip install -r requirements.txt

      - name: Download benchmark resources artifact
        if: inputs.benchmark_artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.benchmark_artifact_name }}
          path: downloaded-benchmark

      - name: Verify benchmark resources
        shell: bash -l {0}
        run: test -f "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}"

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build the ${{ env.SOFTWARE_NAME }} container
        run: |
          docker build -t "local/taylor-couette-flow-dumux:ci" "dumux/container"
          docker save -o "${RUNNER_TEMP}/image.tar" "local/taylor-couette-flow-dumux:ci"
          apptainer build "${RUNNER_TEMP}/dumux.sif" "docker-archive://${RUNNER_TEMP}/image.tar"
          rm "${RUNNER_TEMP}/image.tar"
          echo "BENCHMARK_CONTAINER=${RUNNER_TEMP}/dumux.sif" >> "$GITHUB_ENV"

      - name: Run ${{ env.BENCHMARK_NAME }} using ${{ env.SOFTWARE_NAME }}
        shell: bash -l {0}
        run: |
          ROCRATE_DESCRIPTION="${ROCRATE_DESCRIPTION_BASE}, Version ${BENCHMARK_VERSION}, Branch ${BRANCH_NAME}"

          cd "$GITHUB_WORKSPACE/${SOFTWARE_NAME}/"
          python run_benchmark.py \
            --benchmark-file "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}" \
            --rocrate-name "${SOFTWARE_NAME}_rocrate.zip" \
            --result-path "${GITHUB_WORKSPACE}/${SOFTWARE_NAME}/results" \
            --crate-license "${ROCRATE_LICENSE}" \
            --crate-name "${ROCRATE_NAME}" \
            --crate-description "${ROCRATE_DESCRIPTION}" \
            --workflow-path "${GITHUB_WORKSPACE}/.github/workflows/run-benchmark-${SOFTWARE_NAME}.yml" \
            --agent-name "${ROCRATE_AGENT_NAME}" \
            --agent-orcid "${ROCRATE_AGENT_ORCID}"

      - name: Check metrics of every configuration
        shell: bash -l {0}
        run: |
          python scripts/check_metrics.py \
            --benchmark-file "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}" \
            --results "${GITHUB_WORKSPACE}/${SOFTWARE_NAME}/results" \
            --software "DuMux" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Archive results of the ${{ env.SOFTWARE_NAME }} run of ${{ env.BENCHMARK_NAME }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}_results_${{ env.BENCHMARK_NAME }}
          path: |
            ${{ env.SOFTWARE_NAME }}/results/
            !${{ env.SOFTWARE_NAME }}/results/${{ env.SOFTWARE_NAME }}_rocrate.zip

      - name: Archive ${{ env.SOFTWARE_NAME }} aggregate RO-Crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}-aggregate-rocrate
          path: ${{ github.workspace }}/${{ env.SOFTWARE_NAME }}/results/${{ env.SOFTWARE_NAME }}_rocrate.zip
